<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Alliance Atlas · Service Notice</title>
  <style>
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      padding: 20px;
      background:
        linear-gradient(rgba(176, 183, 175, .035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(176, 183, 175, .035) 1px, transparent 1px),
        #0d0f0e;
      background-size: 38px 38px;
      color: #b0b7af;
      font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    }
    main {
      width: min(520px, 100%);
      padding: 24px;
      border: 1px solid rgba(176, 183, 175, .4);
      border-radius: 4px;
      background: #151717;
      box-shadow: 0 20px 70px rgba(0, 0, 0, .48);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 4px 12px;
      border-radius: 4px;
      background: rgba(176, 183, 175, .4);
      font: 12px/1.2 "Courier New", monospace;
    }
    .dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #f00;
    }
    h1 {
      margin: 22px 0 14px;
      color: #d2d8d0;
      font-size: clamp(30px, 8vw, 42px);
      font-weight: 400;
      line-height: 1.08;
      letter-spacing: -.04em;
    }
    p {
      margin: 0;
      font-size: 14px;
      font-weight: 300;
      line-height: 1.7;
      word-break: keep-all;
    }
    p + p { margin-top: 12px; }
    .date {
      margin-top: 22px;
      padding: 12px 14px;
      border: 1px solid rgba(176, 183, 175, .22);
      border-radius: 4px;
      background: rgba(176, 183, 175, .08);
      color: #d2d8d0;
      font: 700 13px/1.4 "Courier New", monospace;
      text-align: center;
    }
    footer {
      margin-top: 18px;
      color: rgba(176, 183, 175, .58);
      font: 11px/1.4 "Courier New", monospace;
      text-align: right;
    }
  </style>
</head>
<body>
  <main role="dialog" aria-labelledby="notice-title" aria-describedby="notice-copy">
    <div class="badge"><span class="dot"></span><span>SERVICE NOTICE</span></div>
    <h1 id="notice-title">죄송합니다.</h1>
    <div id="notice-copy">
      <p>예상보다 많은 분들이 찾아와 주셔서 서버 트래픽이 빠르게 늘었고, 이번 달 플랜 한도를 모두 사용했습니다.</p>
      <p>여러 방법을 찾아봤지만 지금은 추가 운영비를 마련하기 어려워 서비스를 잠시 닫습니다.</p>
      <p>9월 1일에 다시 열겠습니다. 조금만 기다려 주세요. 불편을 드려 정말 죄송합니다.</p>
    </div>
    <div class="date">REOPENING · 2026.09.01</div>
    <footer>ALLIANCE ATLAS</footer>
  </main>
</body>
</html>
